name: Build Firmware

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache PlatformIO dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            .pio/libdeps
          key: pio-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build firmware
        # extra_scripts=post:scripts/auto_uploadfs.py only hooks into "upload",
        # not "run", so it is safe to build without a connected device.
        run: pio run -e esp32-s3-devkitc1-n16r8

      - name: Build LittleFS image
        run: pio run -e esp32-s3-devkitc1-n16r8 --target buildfs

      # ── Binaries zusammenstellen ───────────────────────────────────────────
      - name: Create full-flash binary (esptool merge_bin)
        run: |
          pip install esptool
          BUILD=.pio/build/esp32-s3-devkitc1-n16r8
          python -m esptool --chip esp32s3 merge_bin \
            --output firmware_full_flash.bin \
            0x0000  $BUILD/bootloader.bin \
            0x8000  $BUILD/partitions.bin \
            0x10000 $BUILD/firmware.bin
          cp $BUILD/firmware.bin firmware_ota.bin
          cp $BUILD/littlefs.bin littlefs.bin

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ github.sha }}
          path: |
            firmware_ota.bin
            firmware_full_flash.bin
            littlefs.bin
          retention-days: 30

      # ── Vorabrelease bei jedem Push auf main ───────────────────────────────
      # Tag "latest" wird immer auf den aktuellen main-Commit verschoben.
      # prerelease: true → erscheint im Dropdown als "[Vorab] latest"
      - name: Update Vorabrelease (latest)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Vorabversion (latest)"
          prerelease: true
          make_latest: false
          files: |
            firmware_ota.bin
            firmware_full_flash.bin
            littlefs.bin
          body: |
            ## Vorabversion – aktueller Entwicklungsstand

            Automatisch gebaut von Commit ${{ github.sha }} (`${{ github.ref_name }}`)
            Zeitstempel: ${{ github.event.head_commit.timestamp }}

            > ⚠️ Dies ist kein stabiles Release. Für den Produktiveinsatz eine nummerierte Version (z.B. v1.0.x) verwenden.

            | Datei | Verwendung |
            |-------|-----------|
            | `firmware_ota.bin` | OTA-Update über Web-Interface |
            | `firmware_full_flash.bin` | Erstmaliges Flashen per USB (`esptool`) |
            | `littlefs.bin` | Dateisystem (Web-UI) – nur bei Erstinstallation nötig |

            ### USB-Flash Befehl
            ```
            esptool.py --chip esp32s3 --baud 921600 write_flash 0x0 firmware_full_flash.bin
            ```

      # ── Stabiles Release bei v*-Tags ──────────────────────────────────────
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          make_latest: true
          files: |
            firmware_ota.bin
            firmware_full_flash.bin
            littlefs.bin
          body: |
            ## Firmware ${{ github.ref_name }}

            | Datei | Verwendung |
            |-------|-----------|
            | `firmware_ota.bin` | OTA-Update über Web-Interface |
            | `firmware_full_flash.bin` | Erstmaliges Flashen per USB (`esptool`) |
            | `littlefs.bin` | Dateisystem (Web-UI) – nur bei Erstinstallation nötig |

            ### USB-Flash Befehl
            ```
            esptool.py --chip esp32s3 --baud 921600 write_flash 0x0 firmware_full_flash.bin
            ```
