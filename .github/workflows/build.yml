name: Build Firmware

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache PlatformIO dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            .pio/libdeps
          key: pio-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build firmware
        # extra_scripts=post:scripts/auto_uploadfs.py only hooks into "upload",
        # not "run", so it is safe to build without a connected device.
        run: pio run -e esp32-s3-devkitc1-n16r8

      - name: Build LittleFS image
        run: pio run -e esp32-s3-devkitc1-n16r8 --target buildfs

      # ── Binaries zusammenstellen ───────────────────────────────────────────
      - name: Create full-flash binary (esptool merge_bin)
        run: |
          pip install esptool
          BUILD=.pio/build/esp32-s3-devkitc1-n16r8
          python -m esptool --chip esp32s3 merge_bin \
            --output firmware_full_flash.bin \
            0x0000  $BUILD/bootloader.bin \
            0x8000  $BUILD/partitions.bin \
            0x10000 $BUILD/firmware.bin
          cp $BUILD/firmware.bin firmware_ota.bin
          cp $BUILD/littlefs.bin littlefs.bin

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ github.sha }}
          path: |
            firmware_ota.bin
            firmware_full_flash.bin
            littlefs.bin
          retention-days: 30

      # ── Vorabrelease bei jedem Push auf main ───────────────────────────────
      # Tag "latest" wird immer auf den aktuellen main-Commit verschoben.
      - name: Update Vorabrelease (latest)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BODY="## Vorabversion – aktueller Entwicklungsstand

          Automatisch gebaut von Commit \`${{ github.sha }}\` (\`${{ github.ref_name }}\`)
          Zeitstempel: ${{ github.event.head_commit.timestamp }}

          > ⚠️ Dies ist kein stabiles Release. Für den Produktiveinsatz eine nummerierte Version (z.B. v1.0.x) verwenden.

          | Datei | Verwendung |
          |-------|-----------|
          | \`firmware_ota.bin\` | OTA-Update über Web-Interface |
          | \`firmware_full_flash.bin\` | Erstmaliges Flashen per USB (\`esptool\`) |
          | \`littlefs.bin\` | Dateisystem (Web-UI) – nur bei Erstinstallation nötig |

          ### USB-Flash Befehl
          \`\`\`
          esptool.py --chip esp32s3 --baud 921600 write_flash 0x0 firmware_full_flash.bin
          \`\`\`"

          # Tag auf aktuellen Commit verschieben
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git tag -fa latest -m "Vorabversion (latest)" HEAD
          git push origin latest --force

          # Release aktualisieren (oder neu erstellen falls noch nicht vorhanden)
          if gh release view latest &>/dev/null; then
            gh release edit latest \
              --title "Vorabversion (latest)" \
              --prerelease \
              --notes "$BODY"
            gh release upload latest --clobber \
              firmware_ota.bin firmware_full_flash.bin littlefs.bin
          else
            gh release create latest \
              --title "Vorabversion (latest)" \
              --prerelease \
              --notes "$BODY" \
              firmware_ota.bin firmware_full_flash.bin littlefs.bin
          fi

      # ── Versionierter Vorabrelease per Commit-Marker ──────────────────────
      # Tag-Pushes aus der Cloud-Entwicklungsumgebung sind blockiert. Ein
      # benannter Vorabrelease lässt sich daher über einen Marker in der
      # Commit-Message von main auslösen:  [prerelease vX.Y.Z-preN]
      - name: Versionierter Vorabrelease (Commit-Marker)
        if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[prerelease v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          TAG=$(printf '%s' "$MSG" | grep -oE '\[prerelease v[0-9A-Za-z.\-]+\]' | head -1 | sed -E 's/^\[prerelease (v[0-9A-Za-z.\-]+)\]$/\1/')
          if [ -z "$TAG" ]; then echo "Kein gültiger Versions-Tag im Marker gefunden"; exit 1; fi
          echo "Erstelle Vorabrelease $TAG aus ${{ github.sha }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG existiert bereits – überspringe"; exit 0
          fi
          gh release create "$TAG" \
            --target "${{ github.sha }}" \
            --title "Vorabversion $TAG" \
            --prerelease \
            --notes "## Vorabversion $TAG

          > ⚠️ Dies ist eine Vorabversion zum Testen. Für den Produktiveinsatz eine stabile Version verwenden.

          | Datei | Verwendung |
          |-------|-----------|
          | \`firmware_ota.bin\` | OTA-Update über Web-Interface |
          | \`firmware_full_flash.bin\` | Erstmaliges Flashen per USB (\`esptool\`) |
          | \`littlefs.bin\` | Dateisystem (Web-UI) – nur bei Erstinstallation nötig |

          ### USB-Flash Befehl
          \`\`\`
          esptool.py --chip esp32s3 --baud 921600 write_flash 0x0 firmware_full_flash.bin
          \`\`\`" \
            firmware_ota.bin firmware_full_flash.bin littlefs.bin

      # ── Stabiles Release bei v*-Tags (ohne -pre) ──────────────────────────
      - name: Create stable Release
        if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-pre')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "Firmware ${{ github.ref_name }}" \
            --latest \
            --notes "## Firmware ${{ github.ref_name }}

          | Datei | Verwendung |
          |-------|-----------|
          | \`firmware_ota.bin\` | OTA-Update über Web-Interface |
          | \`firmware_full_flash.bin\` | Erstmaliges Flashen per USB (\`esptool\`) |
          | \`littlefs.bin\` | Dateisystem (Web-UI) – nur bei Erstinstallation nötig |

          ### USB-Flash Befehl
          \`\`\`
          esptool.py --chip esp32s3 --baud 921600 write_flash 0x0 firmware_full_flash.bin
          \`\`\`" \
            firmware_ota.bin firmware_full_flash.bin littlefs.bin

      # ── Vorabrelease bei v*-pre*-Tags ─────────────────────────────────────
      - name: Create pre-Release
        if: startsWith(github.ref, 'refs/tags/v') && contains(github.ref, '-pre')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "Vorabversion ${{ github.ref_name }}" \
            --prerelease \
            --notes "## Vorabversion ${{ github.ref_name }}

          > ⚠️ Dies ist eine Vorabversion zum Testen. Für den Produktiveinsatz eine stabile Version verwenden.

          | Datei | Verwendung |
          |-------|-----------|
          | \`firmware_ota.bin\` | OTA-Update über Web-Interface |
          | \`firmware_full_flash.bin\` | Erstmaliges Flashen per USB (\`esptool\`) |
          | \`littlefs.bin\` | Dateisystem (Web-UI) – nur bei Erstinstallation nötig |

          ### USB-Flash Befehl
          \`\`\`
          esptool.py --chip esp32s3 --baud 921600 write_flash 0x0 firmware_full_flash.bin
          \`\`\`" \
            firmware_ota.bin firmware_full_flash.bin littlefs.bin
