<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>WLAN-Einrichtung</title>
<style>
:root {
  --bg: #0f1117;
  --surface: #1a1d2e;
  --surface2: #212438;
  --border: #2a2d3e;
  --text: #e8eaf6;
  --sub: #8892b0;
  --accent: #5c7cfa;
  --ok: #2dd4bf;
  --warn: #fbbf24;
  --danger: #f87171;
  --radius: 14px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { height: 100%; }
body {
  font-family: system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 24px 16px env(safe-area-inset-bottom);
}
.logo {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 20px 0 28px;
  color: var(--accent);
  font-weight: 700;
  font-size: 1.1rem;
}
.logo svg { width: 32px; height: 32px; fill: none; stroke: currentColor; stroke-width: 2;
  stroke-linecap: round; stroke-linejoin: round; }
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  width: 100%;
  max-width: 420px;
  margin-bottom: 14px;
}
.card-title {
  font-size: .75rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .07em;
  color: var(--sub);
  margin-bottom: 14px;
}
.btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 10px;
  font-size: 1rem;
  font-weight: 700;
  cursor: pointer;
  transition: filter .15s, transform .1s;
  font-family: inherit;
}
.btn:active { transform: scale(.97); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:not(:disabled):hover { filter: brightness(1.1); }
.btn-secondary { background: var(--surface2); color: var(--text); }
.btn-secondary:not(:disabled):hover { filter: brightness(1.1); }
.network-list { display: flex; flex-direction: column; gap: 8px; }
.net-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 14px;
  background: var(--surface2);
  border: 2px solid transparent;
  border-radius: 10px;
  cursor: pointer;
  transition: border-color .15s, background .15s;
}
.net-item:hover { background: #262a42; }
.net-item.selected { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, var(--surface2)); }
.net-ssid { flex: 1; font-weight: 600; font-size: .95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.net-meta { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
.net-lock { color: var(--sub); }
.net-lock svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2.5; }
.signal-bars { display: flex; align-items: flex-end; gap: 2px; height: 16px; }
.signal-bars span {
  width: 4px;
  border-radius: 1px;
  background: var(--border);
}
.signal-bars span.active { background: var(--ok); }
.signal-bars span:nth-child(1) { height: 4px; }
.signal-bars span:nth-child(2) { height: 7px; }
.signal-bars span:nth-child(3) { height: 11px; }
.signal-bars span:nth-child(4) { height: 16px; }
.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
.field label { font-size: .82rem; font-weight: 600; color: var(--sub); }
.input-wrap { position: relative; }
.input {
  width: 100%;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 10px;
  color: var(--text);
  padding: 12px 46px 12px 14px;
  font-size: 1rem;
  transition: border-color .15s;
  font-family: inherit;
}
.input:focus { outline: none; border-color: var(--accent); }
.show-pass {
  position: absolute;
  right: 12px;
  top: 50%;
  transform: translateY(-50%);
  background: none;
  border: none;
  color: var(--sub);
  cursor: pointer;
  padding: 4px;
}
.show-pass svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; }
.status {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 14px;
  border-radius: 10px;
  font-size: .9rem;
  font-weight: 600;
  margin-bottom: 14px;
}
.status.ok     { background: color-mix(in srgb, var(--ok) 12%, transparent);     color: var(--ok);     border: 1px solid color-mix(in srgb, var(--ok) 30%, transparent); }
.status.warn   { background: color-mix(in srgb, var(--warn) 12%, transparent);   color: var(--warn);   border: 1px solid color-mix(in srgb, var(--warn) 30%, transparent); }
.status.danger { background: color-mix(in srgb, var(--danger) 12%, transparent); color: var(--danger); border: 1px solid color-mix(in srgb, var(--danger) 30%, transparent); }
.status.info   { background: color-mix(in srgb, var(--accent) 12%, transparent); color: var(--accent); border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent); }
.status svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; flex-shrink: 0; }
.spinner {
  display: inline-block;
  width: 20px; height: 20px;
  border: 2px solid rgba(255,255,255,.3);
  border-top-color: #fff;
  border-radius: 50%;
  animation: spin .7s linear infinite;
  flex-shrink: 0;
}
@keyframes spin { to { transform: rotate(360deg); } }
.empty { text-align: center; color: var(--sub); padding: 20px; font-size: .9rem; }
.skip-link { color: var(--sub); font-size: .85rem; text-decoration: none; margin-top: 8px; }
.skip-link:hover { color: var(--text); }
#connectForm { display: none; }
</style>
</head>
<body>

<div class="logo">
  <svg viewBox="0 0 24 24"><path d="M5 12.55a11 11 0 0114.08 0M1.42 9a16 16 0 0121.16 0M8.53 16.11a6 6 0 016.95 0M12 20h.01"/></svg>
  WLAN-Einrichtung
</div>

<div id="statusBox" class="status info" style="display:none;max-width:420px;width:100%">
  <div class="spinner"></div>
  <span id="statusText">Verbinde…</span>
</div>

<!-- Network list card -->
<div class="card" id="scanCard">
  <div class="card-title">Verfügbare Netzwerke</div>
  <div id="netList" class="network-list">
    <div class="empty">Netzwerke werden gesucht…</div>
  </div>
  <div style="margin-top:14px">
    <button class="btn btn-secondary" onclick="startScan()" id="scanBtn">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      Erneut suchen
    </button>
  </div>
</div>

<!-- Connect form card -->
<div class="card" id="connectCard" style="display:none">
  <div class="card-title" id="connectTitle">Verbinden mit…</div>
  <div id="connectForm">
    <div class="field">
      <label for="passInput">Passwort</label>
      <div class="input-wrap">
        <input type="password" id="passInput" class="input" placeholder="WLAN-Passwort" autocomplete="current-password">
        <button type="button" class="show-pass" onclick="togglePass()" title="Anzeigen">
          <svg id="eyeIcon" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
    </div>
    <button class="btn btn-primary" onclick="connect()" id="connectBtn">
      Verbinden
    </button>
    <button class="btn btn-secondary" style="margin-top:8px" onclick="cancelConnect()">
      Abbrechen
    </button>
  </div>
</div>

<a href="/" class="skip-link">Zur Hauptanwendung →</a>

<script>
'use strict';

let selectedSsid = '';
let selectedOpen  = false;
let scanning = false;

// ── Signal bars ────────────────────────────────────────────────
function signalBars(rssi) {
  const strength = rssi >= -50 ? 4 : rssi >= -65 ? 3 : rssi >= -75 ? 2 : 1;
  let html = '<div class="signal-bars">';
  for (let i = 1; i <= 4; i++)
    html += `<span class="${i <= strength ? 'active' : ''}"></span>`;
  return html + '</div>';
}

// ── Status box ────────────────────────────────────────────────
function showStatus(msg, type = 'info', spinner = false) {
  const box  = document.getElementById('statusBox');
  const text = document.getElementById('statusText');
  box.className = `status ${type}`;
  box.style.display = 'flex';
  const icon = spinner
    ? '<div class="spinner"></div>'
    : type === 'ok'
      ? '<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>'
      : type === 'danger'
        ? '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>'
        : '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>';
  box.innerHTML = icon + `<span>${msg}</span>`;
}

function hideStatus() {
  document.getElementById('statusBox').style.display = 'none';
}

// ── WiFi Scan ────────────────────────────────────────────────
async function startScan() {
  if (scanning) return;
  scanning = true;
  const btn = document.getElementById('scanBtn');
  btn.disabled = true;
  btn.innerHTML = '<div class="spinner" style="border-top-color:#fff;border-color:rgba(255,255,255,.3)"></div> Suche…';
  document.getElementById('netList').innerHTML = '<div class="empty">Netzwerke werden gesucht…</div>';

  try {
    // Trigger scan
    await fetch('/api/wifi/scan-start');
    // Poll until done
    for (let attempt = 0; attempt < 12; attempt++) {
      await sleep(1500);
      const r   = await fetch('/api/wifi/scan-result');
      const data = await r.json();
      if (!data.scanning) {
        renderNetworks(data.networks || []);
        break;
      }
    }
  } catch (e) {
    document.getElementById('netList').innerHTML = `<div class="empty">Fehler: ${e.message}</div>`;
  } finally {
    scanning = false;
    btn.disabled = false;
    btn.innerHTML = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg> Erneut suchen';
  }
}

function renderNetworks(nets) {
  const list = document.getElementById('netList');
  if (!nets.length) {
    list.innerHTML = '<div class="empty">Keine Netzwerke gefunden</div>';
    return;
  }
  list.innerHTML = nets.map(n => `
    <div class="net-item" onclick="selectNetwork('${esc(n.ssid)}', ${n.open})" data-ssid="${esc(n.ssid)}">
      <div class="net-ssid">${esc(n.ssid)}</div>
      <div class="net-meta">
        ${!n.open ? `<span class="net-lock"><svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg></span>` : ''}
        ${signalBars(n.rssi)}
      </div>
    </div>`).join('');
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

// ── Select network ────────────────────────────────────────────
function selectNetwork(ssid, isOpen) {
  selectedSsid = ssid;
  selectedOpen = isOpen;

  document.querySelectorAll('.net-item').forEach(el =>
    el.classList.toggle('selected', el.dataset.ssid === ssid));

  document.getElementById('connectTitle').textContent = ssid;
  document.getElementById('connectCard').style.display = 'block';
  document.getElementById('connectForm').style.display = 'block';

  const passField = document.getElementById('passInput');
  if (isOpen) {
    passField.value = '';
    passField.placeholder = 'Offenes Netzwerk (kein Passwort)';
    passField.disabled = true;
  } else {
    passField.disabled = false;
    passField.placeholder = 'WLAN-Passwort';
    passField.focus();
  }
  hideStatus();
}

function cancelConnect() {
  selectedSsid = '';
  document.querySelectorAll('.net-item').forEach(el => el.classList.remove('selected'));
  document.getElementById('connectCard').style.display = 'none';
  hideStatus();
}

function togglePass() {
  const input = document.getElementById('passInput');
  const icon  = document.getElementById('eyeIcon');
  if (input.type === 'password') {
    input.type = 'text';
    icon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';
  } else {
    input.type = 'password';
    icon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
  }
}

// ── Connect ────────────────────────────────────────────────────
async function connect() {
  if (!selectedSsid) return;
  const password = document.getElementById('passInput').value;
  const btn = document.getElementById('connectBtn');
  btn.disabled = true;
  btn.innerHTML = '<div class="spinner"></div> Verbinde…';
  showStatus(`Verbinde mit "${selectedSsid}"…`, 'info', true);

  try {
    const res = await fetch('/api/wifi/connect', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ssid: selectedSsid, password })
    });
    const data = await res.json();
    if (!res.ok || data.error) throw new Error(data.error || `HTTP ${res.status}`);

    // Poll for connection status
    showStatus('Warte auf Verbindung…', 'info', true);
    for (let i = 0; i < 20; i++) {
      await sleep(1500);
      try {
        const sr   = await fetch('/api/wifi/status');
        const stat = await sr.json();
        if (stat.connected) {
          showStatus(`Verbunden! IP: ${stat.ip}`, 'ok');
          countdown(stat.ip);
          return;
        }
        if (stat.failed) {
          showStatus('Verbindung fehlgeschlagen – Passwort prüfen', 'danger');
          btn.disabled = false;
          btn.innerHTML = 'Verbinden';
          return;
        }
      } catch {}
    }
    showStatus('Timeout – Verbindung nicht möglich', 'warn');
  } catch(e) {
    showStatus('Fehler: ' + e.message, 'danger');
  } finally {
    btn.disabled = false;
    btn.innerHTML = 'Verbinden';
  }
}

function countdown(ip) {
  let n = 5;
  const tick = () => {
    showStatus(`Verbunden! Weiterleitung in ${n}s… (IP: ${ip})`, 'ok');
    if (n-- > 0) setTimeout(tick, 1000);
    else window.location.href = '/';
  };
  tick();
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

// ── Boot ──────────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', async () => {
  // Check if already connected
  try {
    const r    = await fetch('/api/wifi/status');
    const stat = await r.json();
    if (stat.connected) {
      showStatus(`Bereits verbunden – IP: ${stat.ip}`, 'ok');
      setTimeout(() => { window.location.href = '/'; }, 2000);
      return;
    }
  } catch {}
  startScan();
});
</script>
</body>
</html>
