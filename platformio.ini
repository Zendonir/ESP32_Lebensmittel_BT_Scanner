[env:esp32-s3-devkitc1-n16r8]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21-2/platform-espressif32.zip
board = esp32-s3-devkitc1-n16r8
framework = arduino
monitor_speed = 115200

board_build.arduino.memory_type = qio_opi

board_build.filesystem = littlefs
data_dir = data

lib_deps =
    ArduinoJson@7.4.3
    ESP32Async/AsyncTCP @ ^3.3.0
    ESP32Async/ESPAsyncWebServer @ ^3.11.0
    bodmer/TFT_eSPI @ ^2.5.43

build_flags =
    -Iinclude
    -DBOARD_HAS_PSRAM=1
    -DUSER_SETUP_LOADED=1
    ; Force TFT_eSPI onto ESP32-S3 SPI3/HSPI. The default FSPI path can
    ; dereference an invalid SPI register base and panic with EXCVADDR=0x10.
    -DUSE_HSPI_PORT=1
    -DST7796_DRIVER=1
    -DTFT_WIDTH=320
    -DTFT_HEIGHT=480
    -DTFT_MOSI=1
    -DTFT_MISO=2
    -DTFT_SCLK=5
    -DTFT_CS=-1
    -DTFT_DC=3
    -DTFT_RST=-1
    -DTFT_BL=6
    -DTFT_BACKLIGHT_ON=HIGH
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    ; Keep optional FreeFont/SmoothFont paths disabled during boot. This app only
    ; uses built-in bitmap fonts, and enabling those optional paths can route
    ; TFT_eSPI::print() through font state that is never initialized here.
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=16000000
    -O2

upload_speed = 921600
monitor_filters = esp32_exception_decoder
