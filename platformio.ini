[env:esp32-s3-devkitc]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; ESP32-S3 specific
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = dio
board_build.flash_size = 16MB
board_build.psram_type = opi

; Define memory partitions for PSRAM
board_upload.flash_size = 16MB
board_upload.use_1200bps_touch = true
board_upload.wait_for_upload_port = true

lib_deps =
    ; LVGL and display drivers
    lvgl/lvgl@^8.3.0
    TFT_eSPI
    bodmer/TFT_eSPI@^2.5.43

    ; Touch and sensor libraries
    ; FT6336 touch is typically handled via wire/I2C

    ; Audio
    esp32-i2s-slm@^1.0.0

    ; WiFi and networking
    ESP Async WebServer
    AsyncTCP
    ArduinoJson@^7.0.0

    ; Utilities
    Preferences

build_flags =
    ; LVGL configuration
    -DUSER_SETUP_LOADED=1
    -DLV_CONF_INCLUDE_SIMPLE=1

    ; Display setup for ST7796
    -DENABLE_GC9A01_DRIVER=0
    -DENABLE_ST7796_DRIVER=1

    ; PSRAM support
    -DBOARD_HAS_PSRAM=1

    ; Arduino-specific
    -DARDUINO_RUNNING_CORE=0
    -DARDUINO_EVENT_RUNNING_CORE=1

upload_speed = 921600
