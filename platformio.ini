[platformio]
data_dir = data

[env:esp32-s3-devkitc1-n16r8]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
board = esp32-s3-devkitc1-n16r8
framework = arduino
monitor_speed = 115200

board_build.arduino.memory_type = qio_opi
board_build.filesystem = littlefs
board_build.partitions = partitions_16mb_dual_fs.csv

lib_deps =
    ArduinoJson@7.4.3
    ESP32Async/AsyncTCP @ ^3.3.0
    ESP32Async/ESPAsyncWebServer @ ^3.11.0
    bodmer/TFT_eSPI @ ^2.5.43
    h2zero/NimBLE-Arduino @ ^2.1.0
    ricmoo/QRCode @ ^0.0.1

build_flags =
    -Iinclude
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM=1
    -DUSER_SETUP_LOADED=1
    ; Force TFT_eSPI onto ESP32-S3 SPI3/HSPI. The default FSPI path can
    ; dereference an invalid SPI register base and panic with EXCVADDR=0x10.
    -DUSE_HSPI_PORT=1
    -DST7796_DRIVER=1
    -DTFT_WIDTH=320
    -DTFT_HEIGHT=480
    -DTFT_MOSI=1
    -DTFT_MISO=2
    -DTFT_SCLK=5
    -DTFT_CS=-1
    -DTFT_DC=3
    -DTFT_RST=-1
    -DTFT_BL=6
    -DTFT_BACKLIGHT_ON=HIGH
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    ; LOAD_GFXFF enables GFX FreeFont support used for Latin-1 text (German umlauts).
    ; Only showCategoryTiles uses setFreeFont(); all other code uses setTextFont().
    -DLOAD_GFXFF=1
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=16000000
    -O2
    ; NOTE: PSRAM task stacks (xTaskCreateWithCaps MALLOC_CAP_SPIRAM) are NOT
    ; safe on ESP32-S3: PSRAM goes through the same cache controller as flash,
    ; so cache-disable during NVS/LittleFS writes makes PSRAM inaccessible and
    ; triggers assert esp_task_stack_is_sane_cache_disabled(). All task stacks
    ; must remain in internal SRAM. The Logger heap buffers in PSRAM are safe
    ; because they are only accessed by Logger code, never during cache-disable.

upload_speed = 921600
monitor_filters = esp32_exception_decoder
extra_scripts =
    pre:scripts/version.py
    post:scripts/auto_uploadfs.py
