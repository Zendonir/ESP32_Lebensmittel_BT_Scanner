[env:esp32-s3-touch-lcd]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

lib_deps =
    ArduinoJson@7.4.3
    ESP32Async/AsyncTCP @ ^3.3.0
    ESP32Async/ESPAsyncWebServer @ ^3.11.0

build_flags =
    -Iinclude
    -O2

upload_speed = 921600
monitor_filters = esp32_exception_decoder
