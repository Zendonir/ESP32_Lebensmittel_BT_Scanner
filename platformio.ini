[env:esp32-s3-touch-lcd]
platform = espressif32@6.8.1
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; ESP32-S3 Konfiguration
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = dio
board_build.flash_size = 16MB
board_build.psram_type = opi
board_build.psram_size = 8MB

; Upload Einstellungen
board_upload.flash_size = 16MB
board_upload.use_1200bps_touch = true
board_upload.wait_for_upload_port = true

; Speicher Optimierungen
board_build.partitions = partitions_custom.csv

lib_deps =
    ; LVGL (aktuelle stabile Version 9.x)
    lvgl/lvgl@^9.2.0

    ; Display Driver - TFT_eSPI (aktuelle stabile)
    bodmer/TFT_eSPI@^2.6.0

    ; JSON Verarbeitung
    ArduinoJson@^7.1.0

    ; Async Web Server (aktuelle stabile)
    me-no-dev/ESP Async WebServer@^1.2.7
    me-no-dev/AsyncTCP@^1.1.4

    ; WiFi & Networking - Teil von Arduino Framework
    ; Preferences - Teil von Arduino Framework

    ; Optional: I2C Sensor Bibliotheken
    adafruit/Adafruit BusIO@^1.16.2

build_flags =
    ; LVGL Konfiguration
    -DLV_CONF_INCLUDE_SIMPLE=1
    -DLV_CONF_PATH="${PROJECT_DIR}/lv_conf.h"

    ; TFT_eSPI Konfiguration
    -DUSER_SETUP_LOADED=1
    -DENABLE_ST7796_DRIVER=1

    ; PSRAM und Speicher
    -DBOARD_HAS_PSRAM=1
    -DPSRAM_CACHE_MALLOC_ALWAYSINTERNAL=0
    -mfix-esp32-psram-cache-issue

    ; FreeRTOS Konfiguration
    -DARDUINO_RUNNING_CORE=0
    -DARDUINO_EVENT_RUNNING_CORE=1
    -DCONFIG_FREERTOS_UNICORE=0

    ; Optimierungen
    -O2
    -Wl,--gc-sections

    ; Debug Level (kann auf CORE_DEBUG_LEVEL_DEBUG für mehr Debug-Output erhöht werden)
    -DCORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_INFO

upload_speed = 921600

; Monitoring Einstellungen
monitor_filters = esp32_exception_decoder, time

; Debugging (optional)
debug_tool = esp-prog
debug_speed = 20000
